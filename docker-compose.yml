services:
  postgres:
    # ParadeDB 镜像 = PostgreSQL + pg_search(BM25) + pgvector，数据卷与 pgvector/pgvector 兼容。
    # 用 pg16 tag 匹配现有 pg_data 卷（0.18.6 默认是 PG17，卷无法复用）。
    # spike 实测：BM25 中文 ngram 分词候选召回 0.575 > ILIKE 词法 0.525，延迟 ~90 倍优
    # （evals/reports/bm25_spike_20260828.md）。BM25 已默认开启且 fail-fast。
    image: paradedb/paradedb:0.18.6-pg16
    container_name: job_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-job_agent}
    ports:
      # 本地开发默认只暴露到 127.0.0.1；生产可设置 POSTGRES_PORT_BIND=空或删除 ports。
      - "${POSTGRES_PORT_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次初始化时由超级用户执行，启用 vector 扩展
      - ./backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_agent} -d ${POSTGRES_DB:-job_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT_BIND:-127.0.0.1:8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-job_agent}
      POSTGRES_USER: ${POSTGRES_USER:-job_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_strong_password}
      # huggingface.co 在当前网络不可达，走国内镜像做模型元数据检查/下载，
      # 否则本地 embedding 模型每次加载都会对 HF 做 5 次指数退避重试（数分钟），
      # 导致 nginx 120s 超时返回 504。
      # 若模型已完整缓存且希望完全离线，可改为设置 HF_HUB_OFFLINE: "1"。
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - ./backend/data:/app/data
      # 持久化 HuggingFace 模型缓存，避免重建容器后重新下载
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # 与 postgres/backend 一致默认只绑本机回环；需要局域网访问时再放开。
      - "${FRONTEND_PORT_BIND:-127.0.0.1:5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

volumes:
  pg_data:
  hf_cache:

