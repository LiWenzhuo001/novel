# =============================================================================
# nginx 配置：uni-app H5 前端静态服务 + /api 反向代理到后端
#
# 关键配置：
# - try_files $uri $uri/ /index.html  →  SPA 路由回退（uni-app H5 无 vue-router）
# - proxy_read_timeout 120s            →  大模型流式响应允许长时间连接
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 上传体积上限：0= 不限制请求体大小（大文件由后端应用处理）；如需上限改为具体字节数即可
    client_max_body_size 0;

    # SPA：所有非文件请求回退到 index.html，由 uni-app 前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 backend 容器（docker-compose 内部 DNS）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大模型流式输出（SSE）可能较慢，增加读超时
        proxy_read_timeout 120s;
    }
}
